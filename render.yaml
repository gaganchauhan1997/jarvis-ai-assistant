services:
    - type: web
      name: jarvis-voice-ai
      runtime: node
      plan: free
      rootDir: .
      buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/api-server run build
      startCommand: node artifacts/api-server/dist/index.mjs
      healthCheckPath: /api/healthz
      envVars:
        - key: NODE_ENV
          value: production
        - key: PORT
          value: 10000
        - key: DATABASE_URL
          sync: false
        - key: GEMINI_API_KEY
          sync: false
        - key: SESSION_SECRET
          sync: false
  