services:
    - type: web
      name: jarvis-voice-ai
      runtime: node
      plan: free
      rootDir: .
      buildCommand: npm install -g pnpm && pnpm install
      startCommand: node_modules/.bin/tsx artifacts/api-server/src/index.ts
      envVars:
        - key: NODE_ENV
          value: production
        - key: PORT
          value: 10000
        - key: DATABASE_URL
          sync: false
        - key: GEMINI_API_KEY
          sync: false
        - key: SESSION_SECRET
          sync: false
  